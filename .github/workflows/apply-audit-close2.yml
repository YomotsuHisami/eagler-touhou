name: Apply audit closure v2

on:
  push:
    branches: [repair/audit-lifecycle-20260910]
    paths:
      - .github/workflows/apply-audit-close2.yml
      - .audit-close2/**

permissions:
  contents: write

concurrency:
  group: audit-closure-v2
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.repository == 'YomotsuHisami/eagler-touhou' &&
      github.event.head_commit.message == 'chore: activate audit closure v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify, reassemble and apply reviewed closure patch
        run: |
          set -euxo pipefail
          echo '24343e9a2aa6882b9eb34bbcb500b5e29d1ca84543e84a9a4e32151682320393  .audit-close2/part-00' | sha256sum -c -
          echo '294c78fb065573cd9d3aa9ce9e56ca09318c450330c8222f2ab87dff9a15593d  .audit-close2/part-01' | sha256sum -c -
          echo '7403e84f05dfa106f426a5a1e38dbd266e38d3c1571ae464d76bd5ad14afbf82  .audit-close2/part-02' | sha256sum -c -
          echo 'd9a60af9f1d0f491ea35b4108eaff96eee0a7e924bf0e5ee820617f470024a37  .audit-close2/part-03' | sha256sum -c -
          echo 'de35b382a32fe79010d161f12dc41c3211fcdf8c420e953141c76644f14b259e  .audit-close2/part-04' | sha256sum -c -
          echo '5e362eacd40f060af7459a259866130cbfe3af612d0c33e5fdbc2597a985105e  .audit-close2/part-05' | sha256sum -c -
          echo 'c4cfae70e32e2544906e4ebc93c722101506fa68c12a08ca0048646bb5ddbb79  .audit-close2/part-06' | sha256sum -c -
          echo '07e30e81ee8977c987edcbae3661c22c5a32634de24f0dd545522aed0588a83b  .audit-close2/part-07' | sha256sum -c -
          echo 'a3a9ccdbbe01ea005b3206fa24fa5ac8da10fd1e5eeecf27852d09dbfc17f353  .audit-close2/part-08' | sha256sum -c -
          echo '1fca184d6d2a9527b09bfaa2f09d280b448eb091f281157aa940fdb944f75706  .audit-close2/part-09' | sha256sum -c -
          echo '0a43910452af0ca211d4def4d96d707a5fc5774002b493c578c83625b914756d  .audit-close2/part-10' | sha256sum -c -
          echo 'a8fe4d87a0a3bce9d607b97cd5b04cd63fff307cd1d80f7cc465e5b6517cc21a  .audit-close2/part-11' | sha256sum -c -
          cat .audit-close2/part-* > "$RUNNER_TEMP/close.b64"
          test "$(sha256sum "$RUNNER_TEMP/close.b64" | cut -d' ' -f1)" = "6ce40f99d7cf44fc55cb5585856a9f777c9ea6ecdd7ca0a59f79da23ad213944"
          base64 -d "$RUNNER_TEMP/close.b64" > "$RUNNER_TEMP/close.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/close.patch.gz" | cut -d' ' -f1)" = "f17cfe6ffdbeb41d1c56216f97a2eb5b65c0e5441ea7f73330631dac0e745d81"
          gzip -dc "$RUNNER_TEMP/close.patch.gz" > "$RUNNER_TEMP/close.patch"
          test "$(sha256sum "$RUNNER_TEMP/close.patch" | cut -d' ' -f1)" = "78c6faba3138db9a64f5407352fb0dde4887241ab3b4baef0c6df2627589bd30"
          git apply --check "$RUNNER_TEMP/close.patch"
          git apply --index "$RUNNER_TEMP/close.patch"
          git rm -r .audit-close2 .audit-close .github/workflows/apply-audit-close2.yml .github/workflows/apply-audit-close.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm run build:launcher
      - name: Native IndexedDB Package Store contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:package-store:native
      - name: Native Launcher lifecycle contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:launcher-lifecycle:native
      - name: Publish validated closure
        run: |
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: close launcher audit follow-ups'
          git push origin HEAD:refs/heads/repair/audit-lifecycle-20260910
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
