name: Apply validated audit repair

on:
  push:
    branches: [repair/audit-lifecycle-20260910]
    paths:
      - .audit-repair.patch.gz
      - .github/workflows/audit-apply.yml

permissions:
  contents: write

concurrency:
  group: audit-apply-lifecycle-20260910
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.repository == 'YomotsuHisami/eagler-touhou'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply exact repair patch
        run: |
          gzip -dc .audit-repair.patch.gz > "$RUNNER_TEMP/audit-repair.patch"
          echo '1c00e7ebef4fd532fed6f23979206fe57624e4009543d52faca6eae914dc8a21  '${RUNNER_TEMP}'/audit-repair.patch' | sha256sum -c -
          git apply --index "$RUNNER_TEMP/audit-repair.patch"
          git rm .audit-repair.patch.gz .github/workflows/audit-apply.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Native IndexedDB Package Store contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:package-store:native
      - name: Publish validated repair
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden launcher lifecycle and package transactions'
          git push origin HEAD:refs/heads/repair/audit-lifecycle-20260910
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
