name: Audit working inputs
on:
  push:
    branches: [repair/audit-lifecycle-20260910]
    paths: [.github/workflows/audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Export tracked source and locked dependencies only
        run: |
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/audit-source.tar.gz"
          tar -czf "$RUNNER_TEMP/audit-node-deps.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-working-inputs
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/audit-source.tar.gz
            ${{ runner.temp }}/audit-node-deps.tar.gz
            ${{ runner.temp }}/audit-source-sha.txt
