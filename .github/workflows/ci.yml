name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install --requirement requirements-ci.txt
      - run: npm run check

  ui-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned main parity source
        run: |
          git fetch --no-tags --depth=1 origin edee9633e5e3ee79cd2e1aa334f84f6caf755090
          git cat-file -e edee9633e5e3ee79cd2e1aa334f84f6caf755090^{commit}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:ui-rewrite
      - run: npm run typecheck:ui-rewrite:tools
      - run: npm run test:ui-rewrite
      - run: npm run build:ui-rewrite
