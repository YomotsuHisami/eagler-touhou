name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm run build:launcher
      - name: Native IndexedDB Package Store contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:package-store:native
      - name: Native Launcher lifecycle contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:launcher-lifecycle:native
