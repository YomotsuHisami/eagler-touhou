<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eagler-touhou — Index Editorial</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#efede7;
  color:#151515;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font:inherit;color:inherit}

:root{
  --bg:#efede7;
  --ink:#151515;
  --muted:#77716b;
  --soft:#c5c0b7;
  --red:#a43d35;
  --line:#1b1b1b;
}

.sheet{
  min-height:100vh;
  padding:20px clamp(18px,3.5vw,52px) 28px;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  border-bottom:2px solid var(--line);
  padding-bottom:9px;
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
header div:nth-child(2){font-weight:800}
header div:last-child{text-align:right}

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 310px;
  border-left:1px solid var(--line);
  margin-top:20px;
  min-height:70vh;
}

.game{
  appearance:none;
  width:100%;
  border:0;
  border-right:1px solid var(--line);
  background:transparent;
  padding:18px;
  text-align:left;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  min-width:0;
}

.game::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:7px;
  background:transparent;
  transition:.18s ease;
}

.game:hover::after{
  background:rgba(164,61,53,.26);
}

.game.selected{
  background:rgba(255,255,255,.26);
}

.game.selected::after{
  background:var(--red);
}

.no{
  font:500 clamp(90px,11vw,170px)/.8 Georgia,serif;
  color:var(--soft);
  letter-spacing:-.07em;
  user-select:none;
}

.game.selected .no{
  color:var(--ink);
}

.game-copy{
  margin-top:auto;
  padding-top:90px;
}

.game h2{
  font:400 clamp(28px,3.2vw,52px)/1 Georgia,"Songti SC",serif;
  margin:0;
  letter-spacing:-.03em;
}

.game small{
  display:block;
  font:12px Georgia,serif;
  color:var(--muted);
  margin-top:8px;
}

.card-foot{
  border-top:1px solid var(--line);
  margin-top:22px;
  padding-top:11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}

.card-foot .mark{
  color:var(--ink);
}

.tools{
  border-right:1px solid var(--line);
  padding:18px;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.tools-head{
  padding-bottom:20px;
}

.tools-head .game-id{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em;
  margin-bottom:6px;
}

.tools-head h3{
  margin:0;
  font:400 22px/1.15 Georgia,"Songti SC",serif;
}

.item{
  padding:15px 0;
  border-top:1px solid var(--line);
}

.itemtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  margin-bottom:10px;
}

.itemtop small{
  color:var(--muted);
  font-size:9px;
}

.mini{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.mini button{
  border:1px solid #aaa49c;
  background:transparent;
  padding:6px 8px;
  font-size:10px;
  cursor:pointer;
}

.mini button.sel{
  background:var(--ink);
  color:var(--bg);
  border-color:var(--ink);
}

.toggle{
  width:42px;
  height:21px;
  border:1px solid #aaa49c;
  border-radius:99px;
  padding:3px;
  display:flex;
  justify-content:flex-end;
  cursor:pointer;
}

.toggle i{
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--red);
  display:block;
}

.launch-wrap{
  margin-top:auto;
  padding-top:28px;
  border-top:1px solid var(--line);
}

.launch{
  width:100%;
  min-height:58px;
  border:1px solid var(--ink);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  cursor:pointer;
  font-size:12px;
  letter-spacing:.06em;
}

.launch span:last-child{
  color:var(--red);
  font-size:18px;
}

.launch:hover{
  background:var(--ink);
  color:var(--bg);
}

.launch:hover span:last-child{
  color:#fff;
}

footer{
  border-top:2px solid var(--line);
  padding-top:10px;
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

@media(max-width:980px){
  .main{
    grid-template-columns:1fr 1fr;
  }
  .tools{
    grid-column:1 / -1;
    border-left:1px solid var(--line);
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0 18px;
  }
  .tools-head{
    grid-column:1 / -1;
  }
  .launch-wrap{
    grid-column:1 / -1;
    margin-top:10px;
  }
}

@media(max-width:720px){
  header{
    grid-template-columns:1fr auto;
  }
  header div:nth-child(2){display:none}
  .main{
    grid-template-columns:1fr;
    border-left:0;
  }
  .game{
    min-height:42vh;
    border-left:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .game-copy{
    padding-top:54px;
  }
  .tools{
    grid-column:auto;
    border-left:1px solid var(--line);
    grid-template-columns:1fr 1fr;
  }
  .tools-head,.launch-wrap{
    grid-column:1 / -1;
  }
}

@media(max-width:480px){
  .sheet{padding:16px 14px 22px}
  .tools{grid-template-columns:1fr}
  .tools-head,.launch-wrap{grid-column:auto}
  footer{display:block;line-height:1.8}
}
</style>
</head>

<body>
<div class="sheet">

  <header>
    <div>eagler-touhou</div>
    <div>TH</div>
    <div>06 / 07</div>
  </header>

  <main class="main">

    <button class="game" data-game="06" data-title="東方紅魔郷">
      <div class="no">06</div>

      <div class="game-copy">
        <h2>東方紅魔郷</h2>
        <small>the Embodiment of Scarlet Devil</small>

        <div class="card-foot">
          <span>TH06</span>
          <span class="mark">选择 →</span>
        </div>
      </div>
    </button>

    <button class="game selected" data-game="07" data-title="東方妖々夢">
      <div class="no">07</div>

      <div class="game-copy">
        <h2>東方妖々夢</h2>
        <small>Perfect Cherry Blossom</small>

        <div class="card-foot">
          <span>TH07</span>
          <span class="mark">已选择</span>
        </div>
      </div>
    </button>

    <aside class="tools">
      <div class="tools-head">
        <div class="game-id" id="gameId">TH07</div>
        <h3 id="gameTitle">東方妖々夢</h3>
      </div>

      <section class="item">
        <div class="itemtop">
          <span>存档</span>
        </div>
        <div class="mini">
          <button>保存</button>
          <button>上传</button>
        </div>
      </section>

      <section class="item">
        <div class="itemtop">
          <span>录像</span>
        </div>
        <div class="mini">
          <button>保存</button>
          <button>上传</button>
        </div>
      </section>

      <section class="item">
        <div class="itemtop">
          <span>音乐</span>
        </div>
        <div class="mini option-group">
          <button>MIDI</button>
          <button class="sel">WAV</button>
          <button>OGG</button>
        </div>
      </section>

      <section class="item">
        <div class="itemtop">
          <span>虚拟按键</span>
          <span class="toggle" aria-hidden="true"><i></i></span>
        </div>
      </section>

      <div class="launch-wrap">
        <button class="launch">
          <span id="launchText">打开 東方妖々夢</span>
          <span>↗</span>
        </button>
      </div>
    </aside>

  </main>

  <footer>
    <span>eagler-touhou</span>
    <span>TH06 ~ TH07</span>
  </footer>

</div>

<script>
const cards = [...document.querySelectorAll('.game')];
const gameId = document.querySelector('#gameId');
const gameTitle = document.querySelector('#gameTitle');
const launchText = document.querySelector('#launchText');

cards.forEach(card => {
  card.addEventListener('click', () => {
    cards.forEach(c => {
      c.classList.remove('selected');
      c.querySelector('.mark').textContent = '选择 →';
    });

    card.classList.add('selected');
    card.querySelector('.mark').textContent = '已选择';

    const no = card.dataset.game;
    const title = card.dataset.title;

    gameId.textContent = `TH${no}`;
    gameTitle.textContent = title;
    launchText.textContent = `打开 ${title}`;
  });
});

document.querySelectorAll('.option-group button').forEach(button => {
  button.addEventListener('click', () => {
    button.parentElement.querySelectorAll('button')
      .forEach(b => b.classList.remove('sel'));
    button.classList.add('sel');
  });
});
</script>
</body>
</html>
