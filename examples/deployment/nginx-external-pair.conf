# Example only. Replace domains, paths and TLS settings for the deployment.
# This file is intended to be included from nginx's http context.

map $arg_v $eagler_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asset.example.com;

    ssl_certificate /etc/letsencrypt/live/asset.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset.example.com/privkey.pem;

    root /var/www/eagler-resource/current;
    index index.html;
    # Generated bounded UI routes; existing resource redirects retain precedence.
    include /var/www/eagler-resource/current/ui-navigation.nginx.conf;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    location = /app-shell-sw.js {
        default_type application/javascript;
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~* \.(?:html|json)$ {
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.(?:js|data|woff|woff2|ttc|otf|jpg|jpeg|webp|zip)$ {
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.(?:ogg|wav)$ {
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin "https://play.example.com" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Vary "Origin" always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.example.com;

    ssl_certificate /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;

    root /var/www/eagler-external/current;
    index index.html;
    # Generated bounded UI routes; existing resource redirects retain precedence.
    include /var/www/eagler-external/current/ui-navigation.nginx.conf;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    # These are redirects rather than reverse proxies. Resource bytes travel
    # from asset.example.com directly to the browser.
    location ^~ /games/ {
        return 307 https://asset.example.com$request_uri;
    }

    location ^~ /shared/ {
        return 307 https://asset.example.com$request_uri;
    }

    location = /app-shell-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location ~* \.(?:js|woff|woff2|ttc|otf|jpg|jpeg|webp)$ {
        add_header Cache-Control $eagler_cache_control;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
