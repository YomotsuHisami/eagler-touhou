# Example only. Adapt paths, TLS, headers and upstreams to your infrastructure.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep redirects relative so reverse proxies / mirror services may listen on
    # private ports (for example :20032) without leaking that port or downgrading
    # an HTTPS client to the origin's internal HTTP scheme.
    absolute_redirect off;

    root /var/www/eagler-touhou;
    index index.html;

    # This file is emitted by the current React publication builder.
    include /var/www/eagler-touhou/ui-navigation.nginx.conf;

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    location = /favicon.ico {
        return 204;
    }

    # Bounded compatibility for the former public mount. The deployment is
    # rooted at /; old bookmarks return to the Launcher instead of becoming a
    # second supported application base.
    location = /eagler-touhou { return 302 /; }
    location = /eagler-touhou/ { return 302 /; }
    location = /eagler-touhou/app-shell-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/eagler-touhou/";
        try_files /legacy-mount-retirement-sw.js =404;
    }
    location ^~ /eagler-touhou/ {
        rewrite ^/eagler-touhou/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    # Optional netplay relay. If eagler-touhou.config.json points directly to a
    # separate wss:// relay origin, this block is not needed.
    location /eagler-netplay/ {
        proxy_pass http://127.0.0.1:18142;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    # HTML and manifests are deployment entry points and must revalidate.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Only content-versioned runtime and frontend assets are immutable.
    # Unversioned URLs revalidate so old JS cannot mix with new WASM/DATA.
    location ~* \.wasm$ {
        default_type application/wasm;
        if ($args ~ "v=") { add_header Cache-Control "public, max-age=31536000, immutable"; }
        if ($args !~ "v=") { add_header Cache-Control "no-cache"; }
        try_files $uri =404;
    }

    # nginx 1.18's stock mime.types on Ubuntu 22.04 does not include .mjs.
    # Browser module imports reject application/octet-stream, so declare it
    # explicitly instead of relying on the distro MIME table.
    location ~* \.mjs$ {
        default_type application/javascript;
        if ($args ~ "v=") { add_header Cache-Control "public, max-age=31536000, immutable"; }
        if ($args !~ "v=") { add_header Cache-Control "no-cache"; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        if ($args ~ "v=") { add_header Cache-Control "public, max-age=31536000, immutable"; }
        if ($args !~ "v=") { add_header Cache-Control "no-cache"; }
        try_files $uri =404;
    }

    location ~* \.(js|data|woff|woff2|ttc|otf|jpg|jpeg|webp)$ {
        if ($args ~ "v=") { add_header Cache-Control "public, max-age=31536000, immutable"; }
        if ($args !~ "v=") { add_header Cache-Control "no-cache"; }
        try_files $uri =404;
    }

    location ~* "\.[a-f0-9]{24}\.zip$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Music URLs include pack versions, while a seven-day ceiling permits
    # operational recovery even if a CDN cache is populated during rollout.
    location ~* \.(ogg|wav)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
